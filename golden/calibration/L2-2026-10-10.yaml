- id: FGW-001
  expected_behavior: answer
  question: What is the FIX Gateway database?
  reference: >-
    It's FIX Gateway's central in-memory table of flight data. Every plugin reads or writes through
    it. Each entry has a short key, such as IAS for indicated airspeed, plus its value, units,
    description, minimum and maximum, and quality flags such as "bad" and "fail".
  answer: >-
    The FIX Gateway database is a central repository for all the information in the system. It's
    a table of information stored in memory, where each item is identified by a unique key, and
    contains values, units, descriptions, and other metadata. The database is defined by a YAML
    text file, and is immutable once the program is loaded.
