  question: What does the DATA annunciator on the PFD mean?
  reference: >-
    It means some of your navigation data, meaning terrain, airport or obstacle packs, is out
    of date or missing. Its color shows the worst pack's severity. It's hidden when everything
    is current. Tap it to open the Data Status screen, where you can update.
  chunks:
  - rank: 1
    source: 'billmallard/pyEfis:docs/wiki/Widgets-System.md :: System & Status Widgets > `data_annunciation`'
    text: >-
      A small, persistent **"DATA"** flag for the flight (PFD) view. It draws a rounded box labeled
      `DATA` in the worst pack's severity color, and — by design — shows **nothing at all** when
      everything is current (or when there is no updater / status file), so a healthy display
      is never cluttered. Tapping it triggers the HMI `show screen` action to jump to the Data
      Status screen. Like `data_status`, it reloads the status file on show and **every 60 s**.
    relevant: null
