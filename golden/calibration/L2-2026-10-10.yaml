- id: FGW-002
  expected_behavior: answer
  question: How do I write a FIX Gateway plugin?
  reference: >-
    Start from the skel.py skeleton in the plugins folder. Your module needs a class named Plugin
    that extends the plugin base class and implements run and stop. Run must return quickly, so
    start a thread for anything long-running. Your plugin's settings from the main config file
    arrive as a dictionary.
  answer: >-
    To write a FIX Gateway plugin, you need to create a Python class that inherits from the `plugin.PluginBase`
    class. This class should have an `__init__` method that is passed a `config` argument, which
    is stored in the object as `self.config`. You should also implement the `run()` and `stop()`
    methods, which will be called by FIX Gateway to start and stop your plugin. You can use the
    `skel.py` file included in the FIX Gateway distribution as a skeleton to get started. This
    file provides a basic structure for a plugin, including the `__init__`, `run()`, and `stop()`
    methods. You can also refer to the documentation for specific plugins, such as the `netfix`
    plugin, to see how they are configured and implemented. Note that FIX Gateway plugins are
    loaded dynamically based on the configuration file, so you don't need to modify the FIX Gateway
    code to add a new plugin. You just need to create the plugin class and configure it in the
    main configuration file.
  grade:
    behavior: null
    correct: null
    speakable: null
    comment: null
