# ----------------------------------------------------------- synthetic vision
- id: SVS-001
  category: procedural
  question: "Is synthetic vision on by default, and how do I turn it on?"
  spoken_variants:
    - "how do i turn on synthetic vision"
    - "is s v s enabled out of the box"
  expected_answer: >
    It's off by default. To turn it on, edit the virtual VFR instrument's options in
    the screen config: add an "svs" section with "enabled" set to true, then point it
    at the terrain tile folder and the airport, obstacle, water and road databases. The
    shipped config files include a commented example. On a Pi set up from the
    configurator, the data updater adds that section for you. You also need a
    supported GPU and the terrain data installed.
  gold_sources:
    - {repo: billmallard/pyEfis, path: README.rst, heading: "Synthetic Vision"}
    - {repo: billmallard/pyEfis, path: src/pyefis/config/includes/ahrs/virtual_vfr.yaml}
    - {repo: billmallard/pyEfis, path: src/pyefis/config/includes/ahrs/svs.yaml}
    - {repo: billmallard/pyEfis, path: docs/wiki/Widgets-Attitude-and-SVS.md, heading: "Enabling Synthetic Vision"}
  must_include: ["off by default"]
  must_include_any: ["enabled", "enable"]
  must_not_include: []
  expected_behavior: answer
  notes: >
    Two shipped files carry the block in different states. virtual_vfr.yaml has it
    commented out (the README points here). svs.yaml has it present with
    enabled: false, for the SVS-focused screen. Both are correct. Speakability: the
    answer must describe YAML, not read it aloud.

- id: SVS-002
  category: factual
  question: "Where does the synthetic vision data come from?"
  spoken_variants:
    - "where does the terrain data come from"
    - "what's the source of the s v s map data"
  expected_answer: >
    Terrain elevation comes from SRTM and Copernicus GLO-30. Water and major roads come
    from OpenStreetMap, obstacles from the FAA's digital obstacle file, and airports
    and runways from FAA data. The makerplane-data updater keeps them current, or you
    can supply local files.
  gold_sources:
    - {repo: billmallard/pyEfis, path: README.rst, heading: "Synthetic Vision"}
    - {repo: billmallard/makerplane-data, path: docs/terrain.md}
  must_include_any: ["Copernicus", "GLO-30", "SRTM"]
  must_include: ["OpenStreetMap"]
  must_not_include: []
  expected_behavior: answer
  notes: >
    M2 top-1 was makerplane-data docs/svs_runway_terrain.md (runway terrain blending),
    which is related but doesn't answer the question.

- id: VFR-001
  category: conflict
  question: "How do I set up the virtual VFR chart data?"
  spoken_variants:
    - "how do i get the approach data for virtual v f r"
    - "how do i install the c i f p file"
  expected_answer: >
    Download the current FAA CIFP file and extract the FAACIFP18 file into the CIFP
    folder, which defaults to makerplane, pyefis, CIFP in your home directory. Build an
    index file from it with the MakeCIFPIndex script, which comes with the pyavtools
    package that pyEfis installs. The screen configs pick up both files through the
    virtual VFR database settings. For synthetic vision, the NASR airport database
    from makerplane-data is preferred, and CIFP is only the fallback.
  gold_sources:
    - {repo: billmallard/pyEfis, path: README.rst, heading: "Virtual VFR"}
    - {repo: billmallard/pyEfis, path: docs/svs_data_refresh.md, heading: "CIFP"}
    - {repo: billmallard/pyEfis, path: src/pyefis/config/screens/virtualvfr_db.yaml}
    - {repo: makerplane/pyEfis, path: README.rst, heading: "Virtual VFR"}
  must_include: ["CIFP"]
  must_include_any: ["index"]
  must_not_include: ["Screen.PFD"]
  expected_behavior: answer
  notes: >
    Still supported on the fork, per code analysis (2026-10-09; read, not run). Every
    shipped screen includes screens/virtualvfr_db.yaml (dbpath / indexpath under
    ~/makerplane/pyefis/CIFP). Virtual VFR reads CIFP through pyavtools, a pinned
    dependency. The SVS airport DB prefers NASR and keeps CIFPAirportDB as a fallback
    "for users without NASR". README defects: ./MakeCIFPIndex.py exists in neither
    pyEfis repo (it's pyavtools/utils, per docs/svs_data_refresh.md), and "[Screen.PFD]
    section" is the INI-era format. The setting now lives in YAML.

