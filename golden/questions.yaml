# Golden set v1 (2026-10-09). Reviewed: the maintainer ruled HW-005, INST-001, VER-002;
# VFR-001 was settled by code analysis.
#
# Every expected answer was checked against the indexed source documents at the
# commits in docs/notes/M1.md, not against the plan's summary table. Where the docs
# are wrong, stale, or disagree, the expected answer follows the evidence (the
# config or the code), and `notes:` names the document that misleads.
#
# Fields
#   id, category        category: factual | conditional | procedural | version |
#                       speakability | conflict | clarify | out_of_scope
#                       ("conflict" = the corpus contradicts itself or the code)
#   question            canonical text (L1/L2 input)
#   spoken_variants     how a caller might actually say it (L3/L4 input)
#   expected_answer     the reference answer, written to be spoken
#   gold_sources        L1 passes if ANY listed source appears in the top-k.
#                       `heading` is a substring of the chunk's heading path; omit it
#                       to accept any section of the file.
#   trap_sources        stale or misleading documents that produce a confident wrong
#                       answer if retrieved. L1 reports a trap ranked above every gold
#                       source; attribution uses it to blame the corpus, not the agent.
#   must_include        case-insensitive; every term must appear in the answer
#   must_include_any    case-insensitive; at least one term must appear
#   must_not_include    case-insensitive; none may appear
#   expected_behavior   answer | decline | clarify
#   notes               why the case exists / which document misleads
#   review              open question for the maintainer (delete once settled)

# ---------------------------------------------------------------- architecture
- id: ARCH-001
  category: factual
  question: "Where does pyEfis get its flight data?"
  spoken_variants:
    - "where does pie efis get its data from"
    - "how does the efis know my airspeed and altitude"
  expected_answer: >
    From FIX Gateway. pyEfis doesn't read sensors directly; it includes a FIX Gateway
    client and displays whatever flight data FIX Gateway is configured to provide.
    FIX Gateway has to be running separately.
  gold_sources:
    - {repo: billmallard/pyEfis, path: README.rst, heading: "Controls"}
    - {repo: billmallard/pyEfis, path: docs/running_from_source.md, heading: "FIX-Gateway"}
    - {repo: makerplane/pyEfis, path: README.rst, heading: "Controls"}
  must_include: ["FIX Gateway"]
  must_not_include: []
  expected_behavior: answer

- id: ARCH-002
  category: factual
  question: "How does pyEfis connect to FIX Gateway?"
  spoken_variants:
    - "what port does the efis use to talk to fix gateway"
    - "how do the efis and the gateway talk to each other"
  expected_answer: >
    Over the network, using FIX Gateway's Net-FIX protocol on TCP port 3490. The
    default pyEfis config points at port 3490, and FIX Gateway's netfix plugin
    listens there.
  gold_sources:
    - {repo: makerplane/FIX-Gateway, path: doc/plugins/netfix.rst}
    - {repo: billmallard/pyEfis, path: src/pyefis/config/main/default.yaml}
    - {repo: billmallard/pyEfis, path: docs/wiki/Headless-Linux-Appliance.md}
  must_include: ["3490"]
  must_not_include: []
  expected_behavior: answer

