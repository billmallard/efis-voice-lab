- id: CTRL-001
  category: conflict
  question: "How do I change the altimeter setting?"
  spoken_variants:
    - "how do i set the altimeter"
    - "how do i change the baro setting"
  expected_answer: >
    Use the plus and minus buttons by the barometric setting on the altimeter. Each
    press steps the setting by one hundredth of an inch of mercury, and they repeat
    if you hold them.
  gold_sources:
    - {repo: billmallard/pyEfis, path: docs/wiki/Pilots-Guide.md, heading: "Setting the altimeter"}
  trap_sources:
    - {repo: billmallard/pyEfis, path: README.rst, heading: "Controls"}
