- id: HW-003
  category: conditional
  question: "Do I need a GPU to run pyEfis?"
  spoken_variants:
    - "does pie efis need a graphics card"
    - "do I have to have a GPU for this thing"
  expected_answer: >
    Only for synthetic vision. The core instruments are drawn on the CPU, so no GPU is
    needed with synthetic vision turned off. With it on, you need OpenGL ES 3 or desktop
    GL 3; the Pi 5's built-in GPU handles that.
  gold_sources:
    - {repo: billmallard/pyEfis, path: README.rst, heading: "Hardware"}
  trap_sources:
    - {repo: billmallard/pyEfis, path: docs/perf_baseline_gpu_required.md}
  must_include: ["synthetic vision", "CPU"]
  must_not_include: []
  expected_behavior: answer
  notes: >
    Look-alike trap: the internal engineering doc docs/perf_baseline_gpu_required.md
    outranks the README for this question (M1/M2). It covers a performance branch,
    not user requirements.

- id: HW-004
  category: conditional
  question: "What happens if synthetic vision is turned on but there's no usable GPU?"
  spoken_variants:
    - "what if i turn on synthetic vision and my computer can't do it"
    - "does it crash without a graphics card if svs is on"
  expected_answer: >
    It doesn't crash. Synthetic vision disables itself when the GL renderer fails to
    start, the attitude display falls back to the normal sky and ground view with an
    "SVS UNAVAIL" annunciation, and the EFIS keeps running. With only software GL it
    renders correctly but slowly.
  gold_sources:
    - {repo: billmallard/pyEfis, path: README.rst, heading: "Suggested"}
    - {repo: billmallard/pyEfis, path: src/pyefis/config/includes/ahrs/svs.yaml}
  must_include: ["UNAVAIL"]
  must_include_any: ["keeps running", "continues", "still runs"]
  must_not_include: []
  expected_behavior: answer

- id: HW-005
  category: conflict
  question: "How much storage does the North America terrain data need?"
  spoken_variants:
    - "how big is the terrain data for all of north america"
    - "how much disk space do i need for terrain"
  expected_answer: >
    About 120 gigabytes on disk for all of North America: roughly 90 for the terrain
    tiles plus about 30 for the zoom pyramid. That's why an M.2 hat with an NVMe SSD is
    strongly preferred over the microSD card. The download itself is compressed, about
    60 gigabytes, and most installs only pull the regions they fly. One western-US
    region is about 10 gigabytes.
  gold_sources:
    - {repo: billmallard/makerplane-data, path: docs/terrain.md, heading: "Storage"}
    - {repo: billmallard/makerplane-data, path: docs/terrain.md, heading: "Compression"}
    - {repo: billmallard/makerplane-data, path: docs/terrain.md, heading: "Build + upload"}
  trap_sources:
    - {repo: billmallard/pyEfis, path: README.rst, heading: "Suggested"}
  must_include: ["120"]
  must_include_any: ["NVMe", "M.2"]
  must_not_include: []
  expected_behavior: answer
  notes: >
    The README's "~90 GB" for a full North America set is stale (ruled 2026-10-09). It
    predates the mip pyramid (+31 GB, per makerplane-data terrain.md), and the on-disk
    figure of about 120 GB supersedes it. An answer that leads with 90 GB is citing the
    stale README. The compressed download (about 60 GB) is a different quantity.

