# --------------------------------------------------------------- FIX Gateway
- id: FGW-001
  category: factual
  question: "What is the FIX Gateway database?"
  spoken_variants:
    - "what's the fix gateway database"
    - "how does fix gateway store the data"
  expected_answer: >
    It's FIX Gateway's central in-memory table of flight data. Every plugin reads or
    writes through it. Each entry has a short key, such as IAS for indicated airspeed,
    plus its value, units, description, minimum and maximum, and quality flags such as
    "bad" and "fail".
  gold_sources:
    - {repo: makerplane/FIX-Gateway, path: doc/database.rst}
    - {repo: makerplane/FIX-Gateway, path: README.md, heading: "Parameter Database"}
  must_include_any: ["key"]
  must_include: ["plugin"]
  must_not_include: []
  expected_behavior: answer

- id: FGW-002
  category: procedural
  question: "How do I write a FIX Gateway plugin?"
  spoken_variants:
    - "how do i make a plugin for fix gateway"
    - "can i write my own fix gateway plugin"
  expected_answer: >
    Start from the skel.py skeleton in the plugins folder. Your module needs a class
    named Plugin that extends the plugin base class and implements run and stop. Run
    must return quickly, so start a thread for anything long-running. Your plugin's
    settings from the main config file arrive as a dictionary.
  gold_sources:
    - {repo: makerplane/FIX-Gateway, path: doc/plugin.rst}
  must_include_any: ["skel", "skeleton"]
  must_include: ["run", "stop"]
  must_not_include: []
  expected_behavior: answer

- id: FGW-003
  category: conflict
  question: "Which FIX Gateway command starts the server, and which starts the client?"
  spoken_variants:
    - "how do i start the fix gateway server"
    - "what's the difference between fix g w and fix g w c"
  expected_answer: >
    "fixgw" starts the server and "fixgwc" starts the client. From a source checkout
    they're fixgw.py and fixgwc.py.
  gold_sources:
    - {repo: makerplane/FIX-Gateway, path: doc/getting_started.rst}
  must_include: ["server", "client"]
  must_not_include: []
  expected_behavior: answer
  notes: >
    doc/getting_started.rst contradicts itself. Under Installation it says
    "./fixgw.py ./fixgwc.py -- These will run the client and the server respectively",
    which is backwards. Later it says fixgw and fixgwc are "the server and client
    respectively", which is right, and "Running the server" agrees. An answer that
    follows the first statement is wrong.

- id: FGW-004
  category: version
  question: "Can FIX Gateway connect to X-Plane?"
  spoken_variants:
    - "does fix gateway work with x plane"
    - "can i use x plane with this"
  expected_answer: >
    There's an X-Plane plugin that exchanges data over UDP, receiving on port 49001
    and sending on 49002, which have to match X-Plane's Net Connections settings. But
    upstream's own documentation says the plugin "lacks a lot of work and is not
    really usable" in its current state.
  gold_sources:
    - {repo: makerplane/FIX-Gateway, path: doc/plugins/xplane.rst}
  must_include: ["UDP"]
  must_include_any: ["not really usable", "incomplete", "lacks"]
  must_not_include: []
  expected_behavior: answer
  notes: >
    Only upstream FIX-Gateway is indexed. The billmallard fork's fix-gateway has
    working X-Plane integration, but that is outside the corpus, so the expected answer
    must follow the indexed doc. Indexing the fork's fix-gateway later turns this
    into a proper fork-vs-upstream case.

