# ----------------------------------------------------------- navigation data
- id: DATA-001
  category: factual
  question: "What does the DATA annunciator on the PFD mean?"
  spoken_variants:
    - "what's the data light on the screen"
    - "why does it say data on my display"
  expected_answer: >
    It means some of your navigation data, meaning terrain, airport or obstacle packs,
    is out of date or missing. Its color shows the worst pack's severity. It's hidden
    when everything is current. Tap it to open the Data Status screen, where you can
    update.
  gold_sources:
    - {repo: billmallard/pyEfis, path: docs/wiki/Pilots-Guide.md, heading: "Indications"}
    - {repo: billmallard/pyEfis, path: docs/wiki/Widgets-System.md, heading: "data_annunciation"}
    - {repo: billmallard/pyEfis, path: README.rst, heading: "Synthetic Vision"}
  must_include_any: ["out of date", "outdated", "stale", "missing"]
  must_not_include: []
  expected_behavior: answer
  notes: >
    The README says only that it "reports navigation-data currency". The Pilot's Guide
    says it appears when navdata is out of date or missing. Widgets-System adds that it
    shows nothing when there's no updater status file, so on a device without the
    updater, missing data raises no flag at all. That edge case contradicts the Pilot's
    Guide.

- id: DATA-002
  category: procedural
  question: "How do I update the navigation data?"
  spoken_variants:
    - "how do i update the terrain data"
    - "my data is out of date how do i fix it"
  expected_answer: >
    On the ground with a network connection, open the Data Status screen, which also
    appears at boot, and choose Update. It downloads and installs newer packs with a
    progress bar. You can also import packs from a USB stick.
  gold_sources:
    - {repo: billmallard/pyEfis, path: docs/wiki/Pilots-Guide.md, heading: "Data currency"}
    - {repo: billmallard/makerplane-data, path: README.md}
  must_include: ["Data Status"]
  must_include_any: ["Update"]
  must_not_include: []
  expected_behavior: answer

- id: DATA-003
  category: factual
  question: "What is makerplane-data?"
  spoken_variants:
    - "what is maker plane data"
    - "what does the maker plane data project do"
  expected_answer: >
    It's the navigation-data currency system for pyEfis: signed packs of terrain,
    airports, obstacles, water and roads, built daily and served from
    navdata.aerocommons.org. The EFIS pulls them over WiFi or from USB and tells you
    when something is stale. It handles reference data only, not live flight data,
    which goes through FIX Gateway.
  gold_sources:
    - {repo: billmallard/makerplane-data, path: README.md}
  must_include_any: ["navigation data", "navigation-data", "navdata"]
  must_not_include: []
  expected_behavior: answer
  notes: >
    The pyEfis README links it as github.com/makerplane/makerplane-data, which returns
    404. The repo exists only as billmallard/makerplane-data. An answer that sends
    the caller to the makerplane URL sends them to a dead link.

