# Lab configuration. Every model is swappable; nothing is hard-coded in code.
# Thresholds are initial guesses -- calibrate after the first baseline run.
endpoints:   # override with LAB_OLLAMA_URL / LAB_QDRANT_URL / LAB_AGENT_LLM_URL
  ollama: http://localhost:11434
  qdrant: http://localhost:6333
  agent_llm: null                # null = the ollama endpoint. On a GPU host, point this at a
                                 # native Ollama (e.g. http://localhost:11435) and leave
                                 # embeddings on the Docker one.
models:
  embedding:                     # pulled on first use
    provider: ollama
    name: nomic-embed-text
    document_prefix: "search_document: "   # nomic task prefixes; "" for models without them
    query_prefix: "search_query: "
    batch_size: 32
  agent_llm:                     # the model under test; LAB_AGENT_MODEL overrides the name
    provider: ollama               # ollama | anthropic (hosted, for comparison and the D2 demo)
    name: llama3.1:8b              # M4 pick: qwen3:8b with think off never called search_docs
    temperature: 0
    think: null                    # true/false for models with a reasoning switch (qwen3)
    num_ctx: 8192
    max_tokens: 400
  judge_llm:                     # ANTHROPIC_API_KEY (.env); logged with every run
    provider: anthropic
    name: claude-haiku-4-5
    max_tokens: 2048
    usd_per_mtok_in: 1.00          # for the per-run cost line in reports
    usd_per_mtok_out: 5.00
  stt:                           # M5: CPU int8; Pascal + CTranslate2 CUDA not tried yet
    provider: faster-whisper
    size: small.en
    device: cpu
    compute_type: int8
  tts:                           # the agent's voice (kokoro | piper)
    provider: kokoro
    voice: af_heart
    speed: 1.0
retrieval: {top_k: 5, p95_budget_ms: 300}
agent:
  prompt: lab/agent/prompts/system.md
  tools: [search_docs]           # MCP tools offered to the LLM (get_source returns whole docs)
  hidden_args: [k, repo, origin] # set by the harness, not the model: 8B models mangle filters
                                 # (llama3.1 sent origin "null"); hits still carry origin
  search_k: 5
  max_tool_rounds: 3             # after this the model must answer without tools
  speech_normalize: true         # lab/agent/speech.py: markup out, units as words, before TTS
index:
  collection: efis_docs
voice:
  interruptions: true            # caller speech stops the bot (barge-in)
  user_speech_timeout_s: 0.6     # a pause shorter than this continues the same turn
  idle_timeout_s: 10             # caller silence before the bot re-prompts
  idle_prompt: Are you still there? You can ask me about pyEfis, FIX Gateway, or navigation data.
ingest:
  cache_dir: data/sources        # shallow clones, relative to the repo root
  max_chunk_chars: 1500          # longer sections split on paragraph boundaries
  min_chunk_chars: 40            # shorter sections (bare headings) are dropped
thresholds:
  l1_hit_rate: 0.85              # share of answerable golden questions with a gold source in top-k
  l1_mrr: 0.7                    # mean reciprocal rank of the first gold source
  context_precision: 0.7         # report only: Ragas scored 0.0-0.2 where the maintainer
                                 # graded 0.81-1.0 (M4 calibration), so it doesn't gate L1
  context_recall: 0.7
  faithfulness: 0.8              # per case (L2) and run mean
  answer_relevancy: 0.7          # run mean only
  correctness: 0.8               # share of answer cases the judge passes
  behavior_accuracy: 1.0         # answer / decline / clarify, every case
  speakability: 0.8              # share of cases the speakability judge passes
  stt_wer_max: 0.25
  time_to_first_audio_ms: 1500
