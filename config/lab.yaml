# Lab configuration. Every model is swappable; nothing is hard-coded in code.
# Thresholds are initial guesses -- calibrate after the first baseline run.
endpoints:   # override with LAB_OLLAMA_URL / LAB_QDRANT_URL
  ollama: http://localhost:11434
  qdrant: http://localhost:6333
models:
  embedding:                     # pulled on first use
    provider: ollama
    name: nomic-embed-text
    document_prefix: "search_document: "   # nomic task prefixes; "" for models without them
    query_prefix: "search_query: "
    batch_size: 32
  agent_llm: {provider: ollama, name: null}   # 8B-class instruct model, chosen in M4
  judge_llm:                     # ANTHROPIC_API_KEY (.env); logged with every run
    provider: anthropic
    name: claude-haiku-4-5
    max_tokens: 2048
    usd_per_mtok_in: 1.00          # for the per-run cost line in reports
    usd_per_mtok_out: 5.00
  stt: {provider: faster-whisper, size: small}
  tts: {provider: piper, voice: null}
retrieval: {top_k: 5, p95_budget_ms: 300}
index:
  collection: efis_docs
ingest:
  cache_dir: data/sources        # shallow clones, relative to the repo root
  max_chunk_chars: 1500          # longer sections split on paragraph boundaries
  min_chunk_chars: 40            # shorter sections (bare headings) are dropped
thresholds:
  l1_hit_rate: 0.85              # share of answerable golden questions with a gold source in top-k
  context_precision: 0.7
  context_recall: 0.7
  faithfulness: 0.8
  speakability: 0.8
  stt_wer_max: 0.25
  time_to_first_audio_ms: 1500
