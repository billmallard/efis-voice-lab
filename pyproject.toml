[project]
name = "efis-voice-lab"
version = "0.0.1"
description = "Local lab for building and testing a RAG-backed voice AI agent."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    "httpx",
    "pydantic>=2",
    "pyyaml",
    "qdrant-client",
]

[project.optional-dependencies]
# Pulled in per milestone; M0 only checks they install and import.
# ragas 0.4.3 imports langchain_community.chat_models.vertexai, removed in langchain-community 0.4.
eval = ["ragas", "langchain-community<0.4"]
mcp = ["fastmcp"]
voice = ["pipecat-ai"]

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lab"]

[tool.ruff]
line-length = 100
