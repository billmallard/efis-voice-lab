[project]
name = "efis-voice-lab"
version = "0.0.1"
description = "Local lab for building and testing a RAG-backed voice AI agent."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.143.0",
    "fastmcp>=4.1.0",
    "httpx",
    "pydantic>=2",
    "pyyaml",
    "qdrant-client",
]

[project.scripts]
lab = "lab.cli:main"

[project.optional-dependencies]
# Pulled in per milestone; M0 only checks they install and import.
# ragas 0.4.3 imports langchain_community.chat_models.vertexai, removed in langchain-community 0.4.
eval = [
    "ragas",
    "langchain-community<0.4",
    "anthropic>=1.13.0",
]
voice = ["pipecat-ai[whisper,kokoro,webrtc,websocket,silero,runner]"]

[dependency-groups]
dev = [
    "pytest",
    "robotframework>=7.5",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lab"]

[tool.ruff]
line-length = 100
