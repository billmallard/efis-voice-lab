name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv sync --all-extras --locked
      - run: uv run ruff check .
      - run: uv run pytest -q tests/unit
      - run: uv run python scripts/check_libs.py

  services:
    # M0 acceptance: services come up healthy; embed + retrieve one sentence.
    # M1/M2 acceptance on the small sources (the full corpus is ~10 min of CPU embedding).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv sync --locked --extra voice
      - run: scripts/ci/pull_images.sh
      - run: docker compose up -d --wait
      - run: uv run python scripts/smoke.py
      - run: uv run lab ingest --source makerplane/FIX-Gateway --source makerplane/Documentation
      - name: re-ingest is a no-op
        run: |
          out=$(uv run lab ingest --source makerplane/FIX-Gateway --source makerplane/Documentation)
          echo "$out"
          test -z "$(echo "$out" | grep -v '^up-to-date')"
      - run: uv run python scripts/check_index.py --sources makerplane/FIX-Gateway makerplane/Documentation
      # M2: REST and MCP (stdio) as real processes return identical results. The 300 ms p95
      # budget is enforced on the lab host; a shared runner gets a looser bound.
      - run: uv run python scripts/check_retrieval.py --repeat 2 --budget-ms 1500
      # M3: the L1 Robot suite on the cases the CI index can answer, judge off. This proves
      # the harness end to end; gating on quality (diff against a baseline) is M7.
      - name: L1 suite (harness check)
        run: >
          uv run robot --nostatusrc --outputdir results/L1/robot
          -v L1_REPO:makerplane/FIX-Gateway -v RAGAS:off tests/L1_retrieval
      - name: L1 produced scores and MCP matched REST
        run: |
          uv run python -c "import json; a=json.load(open('results/L1/latest.json'))['aggregate']; print(a); assert a['cases'] >= 5"
          ! grep -q 'MCP and REST differ' results/L1/robot/output.xml
      # M4: the L2 suite with a small CPU model and the judge off. This proves the agent loop
      # (MCP tool discovery, tool calls, deterministic checks, report) end to end; answer
      # quality comes from the 8B baseline on the lab host.
      - name: L2 suite (harness check)
        run: >
          uv run robot --nostatusrc --outputdir results/L2/robot
          -v L2_IDS:FGW-001,FGW-002,OOS-002,CLAR-001 -v JUDGE:off
          -v AGENT_MODEL:qwen2.5:0.5b tests/L2_agent
      - name: L2 produced scores
        run: |
          uv run python -c "import json; a=json.load(open('results/L2/latest.json'))['aggregate']; print(a); assert a['cases'] == 4"
      # M5: one spoken case through the whole voice path (Kokoro caller audio, websocket,
      # VAD, Whisper, the agent, Kokoro) plus the barge-in and silence scenarios, judge
      # off. A harness check on CPU; voice quality and latency come from the lab host.
      - name: L3 suite (harness check)
        run: >
          uv run robot --nostatusrc --outputdir results/L3/robot
          -v L3_IDS:OOS-002 -v L3_GROUPS:variants,behavior -v PERSONA_CASES:OOS-002
          -v JUDGE:off tests/L3_voice
        env:
          LAB_AGENT_MODEL: qwen2.5:0.5b
      - name: L3 produced a spoken turn
        run: |
          uv run python -c "import json; a=json.load(open('results/L3/latest.json'))['aggregate']; print(a['turns'], a['latency_ms'], a['behavior']); assert a['turns'] >= 1"
      - run: uv run lab report
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: harness-results
          path: results/
      - if: failure()
        run: docker compose logs
