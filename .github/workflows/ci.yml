name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv sync --all-extras --locked
      - run: uv run ruff check .
      - run: uv run pytest -q tests/unit
      - run: uv run python scripts/check_libs.py

  smoke:
    # M0 acceptance: services come up healthy; embed + retrieve one sentence.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv sync --locked
      # Docker Hub auth can time out on runners; retry the pull before failing.
      - run: for i in 1 2 3; do docker compose pull && break || sleep 15; done
      - run: docker compose up -d --wait
      - run: uv run python scripts/smoke.py
      - if: failure()
        run: docker compose logs
